<!DOCTYPE html><html><head><title>{{ course.name }}</title><link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"></head><body><div class="container mt-4"><h2>{{ course.name }}</h2><p>{{ course.description }}</p><form action="{% url 'onlinecourse:submit' course.id %}" method="post">{% csrf_token %}{% for question in course.question_set.all %}<div class="card mb-3"><div class="card-header"><b>{{ question.content }}</b></div><div class="card-body">{% for choice in question.choice_set.all %}<div class="form-check"><input class="form-check-input" type="checkbox" name="choice" value="{{ choice.id }}"><label class="form-check-label">{{ choice.content }}</label></div>{% endfor %}</div></div>{% endfor %}<input class="btn btn-primary btn-block mb-4" type="submit" value="Submit Assessment"></form></div></body></html>
