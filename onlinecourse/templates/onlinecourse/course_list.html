<!DOCTYPE html><html><head><title>Online Courses</title><link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"></head><body><div class="container mt-4"><h2>Course List</h2>{% if course_list %}<div class="list-group">{% for course in course_list %}<a href="{% url 'onlinecourse:course_details' course.id %}" class="list-group-item list-group-item-action"><b>{{ course.name }}</b> - {{ course.description }}</a>{% endfor %}</div>{% else %}<p>No courses available.</p>{% endif %}</div></body></html>
